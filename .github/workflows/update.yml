name: Build OpenClash APK Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner: $RUNNER_OS"
          uname -a

      - name: Download latest OpenClash APK
        run: |
          mkdir -p repo

          API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | jq -r '.tag_name')

          echo "Latest OpenClash version: $VERSION"

          URL=$(curl -fsSL "$API" \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
            | head -n 1)

          echo "APK URL: $URL"

          test -n "$URL"
          test "$URL" != "null"

          curl -fL --retry 3 "$URL" \
            -o "repo/luci-app-openclash-${VERSION#v}.apk"

          ls -lh repo/

      - name: Build OpenWrt host apk
        run: |
          set -eux

          echo "=== Install build dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libssl-dev \
            liblua5.1-0-dev \
            zlib1g-dev \
            wget

          echo "=== Verify dependencies ==="
          meson --version
          ninja --version
          openssl version
          pkg-config --version

          echo "=== Clone OpenWrt ==="
          git clone --depth=1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          echo "=== OpenWrt revision ==="
          git log -1 --oneline

          echo "=== Prepare OpenWrt ==="
          make defconfig

          echo "=== Build host apk ==="
          make package/system/apk/host/compile -j2 V=s

          echo "=== Locate apk ==="
          find staging_dir -type f -name apk -ls

          echo "=== Test apk ==="
          staging_dir/host/bin/apk --version
          
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update OpenClash APK"
            git push
          fi

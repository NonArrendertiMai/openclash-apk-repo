name: Build OpenClash APK Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner: $RUNNER_OS"
          uname -a

      - name: Download latest OpenClash APK
        run: |
          mkdir -p repo

          API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | jq -r '.tag_name')

          echo "Latest OpenClash version: $VERSION"

          URL=$(curl -fsSL "$API" \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' \
            | head -n 1)

          echo "APK URL: $URL"

          test -n "$URL"
          test "$URL" != "null"

          curl -fL --retry 3 "$URL" \
            -o "repo/luci-app-openclash-${VERSION#v}.apk"

          ls -lh repo/

      - name: Build apk-tools
        run: |
          set -eux

          echo "=== Install build dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libssl-dev \
            liblua5.1-0-dev \
            zlib1g-dev \
            wget

          echo "=== Verify build tools ==="
          meson --version
          ninja --version
          openssl version

          APK_COMMIT="b5a31c0d865342ad80be10d68f1bb3d3ad9b0866"

          echo "=== Download apk-tools ==="
          curl -fL --retry 3 \
            "https://github.com/alpinelinux/apk-tools/archive/${APK_COMMIT}.tar.gz" \
            -o apk-tools.tar.gz

          rm -rf apk-tools
          mkdir apk-tools

          tar -xzf apk-tools.tar.gz \
            --strip-components=1 \
            -C apk-tools

          cd apk-tools

          echo "=== apk-tools VERSION ==="
          cat VERSION

          echo "=== Meson configure ==="
          meson setup build \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=disabled \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl

          echo "=== Build ==="
          meson compile -C build

          echo "=== Locate apk ==="
          find build -type f -name apk -ls

          echo "=== Test apk ==="
          find build -type f -name apk -exec {} --version \;
          
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update OpenClash APK"
            git push
          fi

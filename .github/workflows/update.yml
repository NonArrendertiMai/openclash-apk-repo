name: Build OpenClash APK Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner: $RUNNER_OS"
          uname -a

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libssl-dev \
            liblua5.1-0-dev \
            lua5.1 \
            zlib1g-dev \
            wget

      - name: Build apk-tools
        run: |
          set -eux

          APK_COMMIT="b5a31c0d865342ad80be10d68f1bb3d3ad9b0866"

          echo "Downloading apk-tools commit:"
          echo "$APK_COMMIT"

          curl -fL --retry 3 \
            "https://github.com/alpinelinux/apk-tools/archive/${APK_COMMIT}.tar.gz" \
            -o apk-tools.tar.gz

          rm -rf apk-tools

          mkdir -p apk-tools

          tar -xzf apk-tools.tar.gz \
            --strip-components=1 \
            -C apk-tools

          cd apk-tools

          meson setup build \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=disabled \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl

          meson compile -C build

          echo "=== apk version ==="
          ./build/src/apk --version

          echo "=== apk mkndx help ==="
          ./build/src/apk mkndx --help

          cd ..

      - name: Download latest OpenClash APK
        run: |
          set -eux

          mkdir -p repo

          API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"

          VERSION=$(curl -fsSL "$API" \
            | jq -r '.tag_name')

          URL=$(curl -fsSL "$API" \
            | jq -r '.assets[] |
              select(.name | endswith(".apk")) |
              .browser_download_url' \
            | head -n 1)

          echo "Latest OpenClash version: $VERSION"
          echo "APK URL: $URL"

          test -n "$VERSION"
          test "$VERSION" != "null"

          test -n "$URL"
          test "$URL" != "null"

          rm -f repo/*.apk

          curl -fL --retry 3 "$URL" \
            -o "repo/luci-app-openclash-${VERSION#v}.apk"

          echo "=== Downloaded APK ==="
          ls -lh repo/

      - name: Check signing key
        env:
          OPENCLASH_APK_PRIVATE_KEY: ${{ secrets.OPENCLASH_APK_PRIVATE_KEY }}
        run: |
          set -eux

          test -n "$OPENCLASH_APK_PRIVATE_KEY"

          echo "Signing key secret is available."

          echo "$OPENCLASH_APK_PRIVATE_KEY" \
            > openclash-apk.sec

          chmod 600 openclash-apk.sec

          echo "=== Private key information ==="

          openssl ec \
            -in openclash-apk.sec \
            -text \
            -noout

      - name: Generate APK repository index
        run: |
          set -eux

          test -f openclash-apk.sec
          test -f keys/openclash-apk.pub

          echo "=== Repository public key ==="
          openssl ec \
            -pubin \
            -in keys/openclash-apk.pub \
            -text \
            -noout

          echo "=== Generating packages.adb ==="

          ./apk-tools/build/src/apk mkndx \
            --root . \
            --keys-dir keys \
            --sign openclash-apk.sec \
            --output repo/packages.adb \
            repo/*.apk

          echo "=== Repository files ==="
          ls -lh repo/

          echo "=== APK index ==="

          ./apk-tools/build/src/apk adbdump \
            --format json \
            repo/packages.adb

      - name: Remove private key
        if: always()
        run: |
          set -eux

          rm -f openclash-apk.sec
          rm -f apk-tools.tar.gz

      - name: Commit repository
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo/ keys/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update OpenClash APK repository"
            git push
          fi
